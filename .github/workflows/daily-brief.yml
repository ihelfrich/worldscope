name: Daily briefing

on:
  schedule:
    # 06:17 UTC = 01:17 CDT / 00:17 CST, so the UTC date stamped on the bundle
    # is already the America/Chicago date the desk-officer routine asks for.
    #
    # Why not "0 7": GitHub delays top-of-the-hour scheduled runs under load.
    # Observed starts for "0 7 * * *" between 2026-09-03 and 2026-10-09 were
    # 11:03Z..15:24Z (4-8 h late), which put every bundle outside the 6-hour
    # readiness window of the 09:00Z routine. No desk-officer brief shipped
    # between 2026-09-06 and 2026-10-09 as a result. Off-peak minutes drift
    # far less (that turned out to be wrong; see below). Composition is
    # chained to this run by workflow_run (compose-brief.yml), so it cannot
    # race. Timing for every step is in docs/ROUTINE-desk-officer.md.
    - cron: "17 6 * * *"
    # Measured 2026-11-05..11: the 06:17Z entry actually started between
    # 12:59Z and 16:17Z, 7 to 10 hours late, every day. Nothing downstream
    # can be on time if this is not, so the producer is scheduled several
    # times and the gate job lets the first firing that arrives after 06:10Z
    # without a manifest for the day do the work. The others exit in seconds.
    - cron: "17 22 * * *"
    - cron: "47 0 * * *"
    - cron: "23 2 * * *"
    - cron: "53 4 * * *"
    - cron: "11 8 * * *"
    - cron: "7 10 * * *"
    - cron: "41 12 * * *"
  workflow_dispatch:  # manual runs always build

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

# Opt JS actions into Node.js 24 ahead of the 2026-06-16 forced cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            worldscope/__init__.py
            worldscope/readiness.py
            dist/status/daily
          sparse-checkout-cone-mode: false
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "manual run"; exit 0
          fi
          python3 -m worldscope.readiness should-run --dist dist | tee /tmp/gate.txt
          grep '^run=' /tmp/gate.txt >> "$GITHUB_OUTPUT"
  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the commit/push step rebases onto origin/main on a
          # reject, and a shallow clone can't find the merge base — which
          # silently failed every day, freezing the committed lake for 13 days.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Tailwind toolchain
        run: npm ci --no-audit --no-fund
      - run: pip install -e ".[ci]"
      - name: Generate briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          MEDIACLOUD_API_KEY: ${{ secrets.MEDIACLOUD_API_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # Not a secret: ReliefWeb's pre-approved appname. Empty falls back
          # to the adapter default; set the repo variable if ReliefWeb
          # approves a different name than the one requested.
          RELIEFWEB_APPNAME: ${{ vars.RELIEFWEB_APPNAME }}
          # CI can't see the local 2.6 GB OpenSanctions corpus or the
          # PEP index built from it. Skip those sections so locally-generated
          # content (from Ian's machine, where the data files live) carries
          # forward via the snapshot store rather than being clobbered.
          WORLDSCOPE_SKIP: sanctions,people
          # Use the repo-tracked snapshot store so carry-forward works in CI.
          # Locally-generated sanctions snapshots travel with the repo and
          # CI reads them for the carry-forward render.
          WORLDSCOPE_STORE_PATH: ${{ github.workspace }}/data/store.sqlite
        run: python -m worldscope.brief --out dist
      - name: Compile Tailwind CSS
        # Runs after the Python build so it sees every class referenced in the
        # freshly-generated HTML before purging unused utilities.
        run: npm run build:css
      - name: Prune + VACUUM lake + snapshot store under the 100MB git limit
        # The lake crossed GitHub's hard 100MB file limit (bloated by ~22k
        # quarantine rows), so the push was rejected for ~13 days. Then
        # data/store.sqlite did the same on 2026-07-05. Keep both well under
        # the limit before committing.
        run: python -m worldscope.lake_maintenance
      - name: Bound the published tree (GitHub Pages allows 1 GB)
        # Dated section pages, daily pages and bundles older than 60 days are
        # unlinked orphans; the raw records stay in lake/.
        run: python -m worldscope.dist_maintenance --out dist
      - name: Publish dated readiness contract
        # Composition waits for this exact-date manifest instead of assuming
        # that a fixed clock time means the raw producer finished.
        env:
          WS_REPOSITORY: ${{ github.repository }}
          WS_RUN_ID: ${{ github.run_id }}
          WS_RUN_ATTEMPT: ${{ github.run_attempt }}
          WS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          RUN_DATE=$(python -c "import json; print(json.load(open('dist/run_report.json'))['date'])")
          python -m worldscope.readiness publish-daily \
            --dist dist \
            --date "$RUN_DATE" \
            --repository "$WS_REPOSITORY" \
            --run-id "$WS_RUN_ID" \
            --run-attempt "$WS_RUN_ATTEMPT" \
            --sha "$WS_SHA"
      - name: Commit archive + snapshot store + lake
        run: |
          git config user.name "worldscope-bot"
          git config user.email "noreply@github.com"
          git add -f dist/ data/store.sqlite lake/ || true
          if git diff --staged --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "briefing $(date -u +%Y-%m-%d)"
          # Retry-with-rebase: same race-safety as render-briefings.yml. This
          # job races many concurrent pushers (hourly, render, pushover), so
          # give it more attempts with backoff, and FAIL LOUDLY if it never
          # lands — a swallowed failure here is what froze the lake silently.
          pushed=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push; then
              echo "Pushed on attempt $attempt"; pushed=1; break
            fi
            echo "Push rejected on attempt $attempt; rebasing onto origin/main"
            # Generated artifacts (dist/, lake/, store) are fully rebuilt each
            # run, so on a conflict prefer OUR fresh copy (-X theirs favors the
            # commit being replayed during a rebase). Abort cleanly if it can't.
            git fetch origin main
            git rebase -X theirs origin/main || git rebase --abort
            sleep $((attempt * 3))
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::daily-brief could not push after 8 attempts — lake not updated"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    # GitHub Pages only deploys from the default branch (the github-pages
    # environment is branch-protected). Skip on feature-branch / manual runs so
    # they don't show a spurious "deploy failed" — the build still runs fully.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize Pages deploys with render-briefings.yml: two overlapping
    # deployments make GitHub reject one with "Deployment failed, try again
    # later".
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.first.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      # Pages sometimes sits in "syncing_files" until the action's 10-minute
      # timeout (four runs on 2026-11-10; healthy deploys take 20-60 s). Give
      # up after 5 minutes and try once more instead of failing the run.
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 300000
      - id: deployment
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
