name: Daily briefing

# NOTE: deliberately NOT triggered on push.
#
# It used to be. The desk-officer routine commits briefings/<date>.md with a
# PAT, PAT-authored pushes do trigger workflows, and so every day this entire
# pipeline ran twice: once on the 07:00 cron and again ~09:20 after the
# routine's commit. That meant two full crawls of ~41 upstream sources for one
# brief, and — because the lake wrote predictions and paper_bets with
# INSERT OR REPLACE — the second run silently overwrote the first run's
# forecast record every single day.
on:
  schedule:
    # 07:00 UTC = 03:00 ET (EDT) / 02:00 ET (EST). Runs 2 hours before the
    # desk-officer routine (09:00 UTC) and 3 hours before the morning Pushover
    # (10:00 UTC = 06:00 ET). Sequence: data pull (07:00) -> bundle + Pages
    # deploy (~07:30-08:00) -> desk officer reads zip + composes brief (09:00)
    # -> render-briefings.yml renders MD to HTML on commit (~09:30) ->
    # Pushover sends today's freshly-composed brief at 06:00 ET (10:00 UTC).
    - cron: "0 7 * * *"
  workflow_dispatch:  # so you can fire manually too

permissions:
  contents: write
  copilot-requests: write
  pages: write
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

# Opt JS actions into Node.js 24 ahead of the 2026-06-16 forced cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Shallow. The old full-history clone existed for a commit/push step
          # that rebased onto origin/main on a reject; there is no such step
          # any more, because the lake is no longer committed. blobsync's
          # one-time git-history seed deepens on demand if it ever needs to.
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Tailwind toolchain
        run: npm ci --no-audit --no-fund
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot@1.0.80
      # The 'ci' extra carries matplotlib, fiona, duckdb and the mediacloud
      # SDK. Installing the bare package is why the graphics, maps,
      # ukraine-maps, embeddings and warehouse stages ImportError'd into a
      # swallowed log line on every run since May.
      - run: pip install -e ".[ci]"

      - name: Copilot inference canary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: test -n "$(copilot -p 'Reply READY.' -s --no-ask-user --available-tools= --model auto)"

      - name: Preflight — verify credentials and dependencies
        # Fails the run when a REQUIRED credential or package is absent,
        # before 41 upstream pulls are spent producing a brief that silently
        # omits half its sections. Degraded (optional) capabilities are
        # reported but do not block.
        env:
          COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          MEDIACLOUD_API_KEY: ${{ secrets.MEDIACLOUD_API_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          OPENFEC_API_KEY: ${{ secrets.OPENFEC_API_KEY }}
          GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
          ALERTS_IN_UA_TOKEN: ${{ secrets.ALERTS_IN_UA_TOKEN }}
          # Configured as repo secrets since May and read by no code until now.
          # BEA has no keyless mode (hard requirement); BLS and Congress.gov
          # both work unauthenticated but at sharply lower limits.
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          CONGRESS_GOV_API_KEY: ${{ secrets.CONGRESS_GOV_API_KEY }}
          WORLDSCOPE_SKIP: sanctions,people
        run: python -m worldscope.preflight

      - name: Restore lake + snapshot store
        # The lake is no longer in git. Restore order is local -> newest
        # data-* release -> git history (one-time migration seed) -> cold
        # start. A cold start is announced loudly rather than silently
        # producing a brief with no day-over-day comparisons.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m worldscope.blobsync restore --paths lake,data

      - name: Generate briefing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          MEDIACLOUD_API_KEY: ${{ secrets.MEDIACLOUD_API_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # Lifts FEC off the shared DEMO_KEY (~30 req/hr) and turns on the
          # GovInfo Congressional Record feed, which backs 30% of the
          # political-figures composite score.
          OPENFEC_API_KEY: ${{ secrets.OPENFEC_API_KEY }}
          GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
          ALERTS_IN_UA_TOKEN: ${{ secrets.ALERTS_IN_UA_TOKEN }}
          # Configured as repo secrets since May and read by no code until now.
          # BEA has no keyless mode (hard requirement); BLS and Congress.gov
          # both work unauthenticated but at sharply lower limits.
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          CONGRESS_GOV_API_KEY: ${{ secrets.CONGRESS_GOV_API_KEY }}
          # CI can't see the local 2.6 GB OpenSanctions corpus or the
          # PEP index built from it. Skip those sections so locally-generated
          # content (from Ian's machine, where the data files live) carries
          # forward via the snapshot store rather than being clobbered.
          WORLDSCOPE_SKIP: sanctions,people
          # Use the repo-tracked snapshot store so carry-forward works in CI.
          # Locally-generated sanctions snapshots travel with the repo and
          # CI reads them for the carry-forward render.
          WORLDSCOPE_STORE_PATH: ${{ github.workspace }}/data/store.sqlite
        run: python -m worldscope.brief --out dist
      - name: Compile Tailwind CSS
        # Runs after the Python build so it sees every class referenced in the
        # freshly-generated HTML before purging unused utilities.
        run: npm run build:css
      - name: Prune + VACUUM lake + snapshot store
        # Originally kept both files under GitHub's hard 100 MB per-file limit,
        # which the lake crossed (bloated by ~22k quarantine rows) and froze
        # the push for ~13 days. That limit no longer applies now the lake
        # lives in a Release, but retention still matters: it bounds the
        # tarball and keeps restore fast.
        run: python -m worldscope.lake_maintenance

      - name: Persist lake + snapshot store to the data release
        # Replaces `git add -f dist/ data/store.sqlite lake/` plus an
        # 8-attempt rebase-retry push loop. That committed 948 MB of
        # regenerated data into a public repository and made four workflows
        # fight over one branch.
        #
        # dist/ is included: a Pages deployment replaces the whole site, and
        # render-briefings.yml deploys independently later in the day. If it
        # started from an empty dist/ it would publish only the briefs and
        # delete zips/, sections/ and assets/ from the live site.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m worldscope.blobsync persist --paths lake,data,dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    # GitHub Pages only deploys from the default branch (the github-pages
    # environment is branch-protected). Skip on feature-branch / manual runs so
    # they don't show a spurious "deploy failed" — the build still runs fully.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize Pages deploys with render-briefings.yml: two overlapping
    # deployments make GitHub reject one with "Deployment failed, try again
    # later".
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
