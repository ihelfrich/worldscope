name: Brief dead-man switch

# The September 2026 outage went unnoticed for 34 days because every check
# watched inputs (collection ran, readiness published) and nothing watched
# the output. This watches the output: the desk-officer brief for today must
# be on main by early afternoon Chicago time.
#
# It judges state, not the clock. GitHub starts this repository's scheduled
# runs 7 to 10 hours late, so the old fixed 14:30Z check fired before the
# producer had even started and failed every day (2026-11-05..10). A firing
# now alerts only once it is 13:00 or later in Chicago on the day it checks,
# whenever GitHub happens to start it.
#
# The alert is a Pushover page plus one tracked issue ([pipeline-alert:
# brief-missing]). The issue is the fallback for the weeks Pushover answered
# "no active devices to send to", and it is closed automatically as soon as a
# check finds the brief. Runs chained to a composer only ever close it.

on:
  workflow_run:
    workflows: ["Compose desk-officer brief", "Land routine briefs"]
    types: [completed]
  schedule:
    - cron: "30 13 * * *"
    - cron: "30 17 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Look for today's brief and today's readiness manifest
        id: look
        run: |
          set -euo pipefail
          TODAY=$(TZ=America/Chicago date +%F)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "hour=$(TZ=America/Chicago date +%-H)" >> "$GITHUB_OUTPUT"
          missing=""
          [ -s "briefings/${TODAY}.md" ] || missing="${missing} briefings/${TODAY}.md"
          [ -s "dist/status/daily/${TODAY}.json" ] || missing="${missing} dist/status/daily/${TODAY}.json"
          if [ -f "status/source_not_ready_${TODAY}.txt" ]; then
            missing="${missing} (routine recorded SOURCE_NOT_READY)"
          fi
          echo "missing=${missing}" >> "$GITHUB_OUTPUT"
          if [ -n "$missing" ]; then
            echo "::error::missing for ${TODAY}:${missing}"
          else
            echo "brief and manifest present for ${TODAY}"
          fi
      - name: Alert if the brief is missing and not muted
        if: >-
          steps.look.outputs.missing != '' &&
          github.event_name != 'workflow_run' &&
          (github.event_name == 'workflow_dispatch' || fromJSON(steps.look.outputs.hour) >= 13)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          MUTE_UNTIL: ${{ vars.BRIEF_DEADMAN_MUTE_UNTIL }}
          TODAY: ${{ steps.look.outputs.today }}
          MISSING: ${{ steps.look.outputs.missing }}
          # Diagnose instead of "check the runs": the 2026-10-25..11-12 outage
          # was a missing composer credential that every run reported green.
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          COMPOSE_OFF: ${{ vars.COMPOSE_IN_ACTIONS == 'false' }}
        run: |
          set -euo pipefail
          if [ -n "$MUTE_UNTIL" ] && echo "$MUTE_UNTIL" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
             && ! [[ "$MUTE_UNTIL" < "$TODAY" ]]; then
            echo "muted until $MUTE_UNTIL"
            exit 0
          fi
          LAST=$(ls briefings/ 2>/dev/null | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' | sort | tail -1 | cut -c1-10)
          if [ -n "$LAST" ]; then
            DAYS=$(( ( $(date -u -d "$TODAY" +%s) - $(date -u -d "$LAST" +%s) ) / 86400 ))
            SINCE=" Last brief: ${LAST} (${DAYS} days ago)."
          else
            SINCE=" No brief has ever been composed."
          fi
          if [ "$COMPOSE_OFF" = "true" ]; then
            CAUSE="Composing in Actions is switched off (repo variable COMPOSE_IN_ACTIONS=false), so only the claude.ai routine can write the brief; check that routine."
          elif [ "$HAS_API_KEY" != "true" ] && [ "$HAS_OAUTH" != "true" ]; then
            CAUSE="Likely cause: no Claude credential, so the Compose workflow skips every day while reporting success. Set repo secret ANTHROPIC_API_KEY, or CLAUDE_CODE_OAUTH_TOKEN (from 'claude setup-token')."
          else
            CAUSE="A composer credential is set; check the Daily briefing run (data readiness) and the Compose run's logs."
          fi
          python -m worldscope.pushover_delivery \
            --title "Worldscope: no brief for ${TODAY}" \
            --message "Missing this afternoon:${MISSING}.${SINCE} ${CAUSE}" \
            --url "https://github.com/ihelfrich/worldscope/actions" \
            --priority 1 \
            --fallback-issue brief-missing
      - name: Close the alert once the brief is on main
        if: steps.look.outputs.missing == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TODAY: ${{ steps.look.outputs.today }}
        run: |
          python -m worldscope.alerting resolve --key brief-missing \
            --note "Recovered: the brief and readiness manifest for ${TODAY} are on main."
