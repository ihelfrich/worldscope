name: CI

# Run the test suite on every push and pull request so regressions surface
# before they reach the daily-briefing workflows. None of the existing
# workflows run pytest; this is the gate that does.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Opt JS actions into Node.js 24 ahead of the 2026-06-16 forced cutover (our
# actions still ship Node 20). Silences the deprecation warning and validates
# Node 24 now, without the risk of bumping to action majors we can't verify.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package + dev/test dependencies
        run: |
          python -m pip install --upgrade pip
          # The 'dev' extra carries pytest plus the runtime deps the tests
          # import (numpy, matplotlib). Install the package itself too so the
          # `worldscope` import path resolves.
          pip install -e ".[dev]"
      - name: Static check for bug-class errors
        # Only rules that are bugs, never style: undefined names, names used
        # before assignment, duplicate definitions, invalid comparisons,
        # break/continue/return/yield misplaced, mutable default arguments.
        # A NameError in a rarely-taken path otherwise surfaces in the 06:00
        # daily build, not in review.
        run: |
          pip install "ruff==0.17.5"
          ruff check --no-cache --output-format github \
            --select F821,F822,F823,F811,F632,F701,F702,F704,F706,F707,B006 \
            worldscope tools
      - name: Run tests
        run: pytest
