name: Ukraine theater hourly refresh

# Hourly micro-refresh of the Ukraine theater section: ACLED + FIRMS + air-alert
# + DeepStateMap + Liveuamap + OSINT crawl. Updates the Pages-published maps
# and the lake snapshot under lake/sections/ukraine_theater/<date>/. Does NOT
# fire Pushover; the daily morning routine surfaces Ukraine in its summary.
#
# Idempotency: each run overwrites <date>/ for the current day. The lake's
# upsert semantics keep prior intra-day refreshes addressable by run-id.

on:
  schedule:
    - cron: "15 * * * *"  # every hour at :15 past UTC
  workflow_dispatch:
    inputs:
      force_full_recrawl:
        description: 'Force full re-crawl ignoring cache (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: ukraine-hourly
  cancel-in-progress: true

# Opt JS actions into Node.js 24 ahead of the 2026-06-16 forced cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          # Shallow. This ran fetch-depth: 0 — a full-history clone of a
          # 1.36 GB repository — 24 times a day. The commit step below only
          # needs to add PNGs on top of the tip.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # Was `pip install -r requirements.txt` while daily-brief.yml used
        # `pip install -e .` — two dependency paths that drifted apart. Both
        # now install the package with the same extras.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ci]"

      - name: Install web-intel (Go crawler)
        # Best-effort by design: the section has a documented fallback path.
        # Made explicit rather than hidden behind `|| echo`, so the log says
        # which mode the run is in.
        run: |
          if go install github.com/ihelfrich/web-intel@latest; then
            echo "web-intel=full" >> "$GITHUB_ENV"
          else
            echo "::warning::web-intel install failed; ukraine_theater will use its fallback crawler"
            echo "web-intel=fallback" >> "$GITHUB_ENV"
          fi

      - name: Restore the Ukraine theater lake subtree
        # Scoped deliberately: this job runs 24x/day and only ever writes
        # lake/sections/ukraine_theater. Restoring the whole lake would move
        # ~563 MB an hour to update a few megabytes.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m worldscope.blobsync restore --paths lake/sections/ukraine_theater

      - name: Run Ukraine theater section only
        env:
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
          # Was NASA_FIRMS_KEY, which worldscope/sections/firms.py has never
          # read — it reads FIRMS_MAP_KEY. The thermal-anomaly layer was
          # therefore blind in every hourly refresh since the workflow was
          # written.
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          ALERTS_IN_UA_TOKEN: ${{ secrets.ALERTS_IN_UA_TOKEN }}
          FORCE_FULL_RECRAWL: ${{ github.event.inputs.force_full_recrawl }}
        run: |
          python -m worldscope.run_section --section ukraine_theater --emit-maps

      - name: Persist the theater subtree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m worldscope.blobsync persist --paths lake/sections/ukraine_theater

      - name: Commit refreshed maps
        # Only the map PNGs go to git now. The lake artifacts this job also
        # writes used to be committed here every hour; they now travel in the
        # data release. Note the add below has no -f and never did — once
        # lake/ became gitignored, this step stopped staging it automatically.
        run: |
          git config user.name "ukraine-hourly-bot"
          git config user.email "bot@worldscope.local"
          DATE=$(date -u +%F)
          git add briefings/${DATE}-ukraine*.png 2>/dev/null || true
          git diff --staged --quiet && echo "no new maps" && exit 0
          git commit -m "ukraine hourly maps ${DATE} $(date -u +%H:%M)Z"
          for i in 1 2 3 4 5; do
            if git push origin HEAD; then
              echo "push ok on attempt $i"
              exit 0
            fi
            echo "push failed attempt $i, rebasing"
            git pull --rebase origin main || git rebase --abort
            sleep $((i * 3))
          done
          echo "::error::ukraine-hourly could not push refreshed maps"
          exit 1
