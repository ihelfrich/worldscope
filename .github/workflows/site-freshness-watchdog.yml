name: Site freshness watchdog

# Checks the PRODUCT, not the jobs. Both long outages here were invisible to
# job-level CI (every workflow green while the live site served stale data):
# the 13-day lake freeze in June 2026 and the four-month frozen homepage
# (June-October 2026). This watchdog fetches the deployed site and inspects
# the committed lake daily, and pages Ian via Pushover the moment any of
# these outcome checks fail:
#   live_page / committed_page  homepage date marker is recent
#   lake_fresh / lake_size      lake current and under the 100MB git limit
#   sections_fresh              enough sources still ingesting
#
# Rehearse the alarm end-to-end (forces a failure, sends a clearly-labeled
# test page): Actions -> this workflow -> Run workflow -> rehearse = true.
# Mute real alerts through a repo variable SITE_WATCHDOG_MUTE_UNTIL
# (YYYY-MM-DD), same convention as the brief dead-man switch.

on:
  schedule:
    - cron: "23 16 * * *"   # daily, after the full morning chain has settled
  workflow_dispatch:
    inputs:
      rehearse:
        description: 'Force a failure to test the alert path (sends a test page)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run end-to-end freshness checks
        id: fresh
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "${{ inputs.rehearse }}" = "true" ]; then
            echo "REHEARSAL: forcing failure thresholds"
            python tools/check_freshness.py --skip-live --max-age-days -1
          else
            python tools/check_freshness.py
          fi
      - name: Page Ian if stale (Pushover)
        if: steps.fresh.outcome == 'failure'
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          MUTE_UNTIL: ${{ vars.SITE_WATCHDOG_MUTE_UNTIL }}
          FAILURES: ${{ steps.fresh.outputs.failures }}
          REHEARSE: ${{ inputs.rehearse }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%F)
          if [ "$REHEARSE" != "true" ] && [ -n "${MUTE_UNTIL:-}" ] \
             && echo "$MUTE_UNTIL" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
             && ! [[ "$MUTE_UNTIL" < "$TODAY" ]]; then
            echo "muted until $MUTE_UNTIL"
            exit 0
          fi
          TITLE="Worldscope STALE: site/lake freshness failed"
          PRIORITY=1
          if [ "$REHEARSE" = "true" ]; then
            TITLE="[REHEARSAL] Worldscope watchdog test"
            PRIORITY=0
          fi
          python -m worldscope.pushover_delivery \
            --title "$TITLE" \
            --message "${FAILURES:-see workflow log}" \
            --url "https://github.com/ihelfrich/worldscope/actions/workflows/site-freshness-watchdog.yml" \
            --priority "$PRIORITY"
      - name: Fail the workflow if checks failed
        if: steps.fresh.outcome == 'failure'
        run: |
          echo "::error::freshness checks failed: ${{ steps.fresh.outputs.failures }}"
          exit 1
