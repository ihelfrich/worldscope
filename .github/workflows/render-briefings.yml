name: Render brief markdown to HTML

# When the routine commits a new briefings/<date>.md or
# weekly_briefings/<week>.md, render it to a publication-grade HTML page
# (sidebar TOC, watch-area dashboard, embedded charts + map, anomaly
# callouts) and stage in dist/ so Pages serves at /briefings/<date>.html
# or /weekly_briefings/<week>.html.

on:
  push:
    branches: [main]
    paths:
      - "briefings/**.md"
      - "briefings/**.png"
      - "weekly_briefings/**.md"
      - "weekly_briefings/**.png"
      - "tools/render_brief.py"
      - "tools/render_reasoned.py"
      - "tools/render_board.py"
      - "worldscope/theater_map.py"
  schedule:
    # Catch routine pushes that GITHUB_TOKEN auth suppresses from triggering.
    # Fires hourly between 11:15 and 13:15 UTC (routine cron is 11:00 UTC).
    - cron: "15 11-13 * * *"
    # And once on Friday evenings to catch the weekly routine (20:00 UTC).
    - cron: "30 20 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  copilot-requests: write
  pages: write
  id-token: write

concurrency:
  group: render-briefings
  cancel-in-progress: false

# Opt JS actions into Node.js 24 ahead of the 2026-06-16 forced cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  render:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Tailwind toolchain
        run: npm ci --no-audit --no-fund
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot@1.0.80
      - run: pip install -e ".[ci]"

      - name: Copilot inference canary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: test -n "$(copilot -p 'Reply READY.' -s --no-ask-user --available-tools= --model auto)"

      - name: Restore dist/ + lake
        # dist/ is no longer in git, and a Pages deployment replaces the WHOLE
        # site. Rendering into an empty dist/ would publish only the briefs and
        # silently delete zips/, sections/ and assets/ — including the
        # zips/<date>.zip the desk-officer routine fetches every morning.
        # site_builder also reads lake artifacts to rebuild section pages.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m worldscope.blobsync restore --paths dist,lake

      - name: Fingerprint dist/ before rendering
        id: before
        run: echo "sum=$(find dist -type f -newermt '1970-01-01' -print0 2>/dev/null | sort -z | xargs -0 sha256sum 2>/dev/null | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Render every brief to HTML
        env:
          # Lets render-time generation use the provider-neutral model gateway.
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/render_brief.py
      - name: Rebuild section pages so Tailwind sees their classes
        # The site_builder emits HTML with the same utility classes the
        # brief uses; rebuild before compiling CSS so nothing gets purged.
        # No `|| true`: a failure here means the section drill-downs are stale
        # or missing, which is worth a red run rather than a silent gap.
        run: python -m worldscope.site_builder --out dist --days 3
      - name: Compile Tailwind CSS
        run: npm run build:css
      - name: Publish dist/ and decide whether to deploy
        id: commit
        # Replaces a `git add -f dist/...` + commit + 5-attempt rebase-push
        # loop. dist/ is generated output; it goes to the data release and to
        # the Pages artifact, never into git history.
        #
        # `changed` still gates the deploy, but it is now derived from the
        # rendered bytes rather than from whether git found a diff.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AFTER=$(find dist -type f -print0 2>/dev/null | sort -z | xargs -0 sha256sum 2>/dev/null | sha256sum | cut -d' ' -f1)
          if [ "$AFTER" = "${{ steps.before.outputs.sum }}" ]; then
            echo "dist/ is byte-identical after rendering; nothing to publish"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          python -m worldscope.blobsync persist --paths dist

      # The scheduled catch-up runs (4x/day) usually find nothing new to
      # render; redeploying an identical dist/ just burns a Pages deployment
      # and has been failing with "Deployment failed, try again later".
      # Deploy only when this run committed something, or when a human asked.
      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: dist
  deploy:
    needs: render
    if: needs.render.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Serialize Pages deploys with daily-brief.yml (see comment there).
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
