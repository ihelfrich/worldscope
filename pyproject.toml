[project]
name = "worldscope"
version = "0.1.0"
description = "Daily global political, economic, and OSINT briefing — by Ian Helfrich."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "pandas>=2.0",
  "feedparser>=6.0",
  "anthropic>=0.34",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",        # lib/watchareas.py, tools/
  "numpy>=1.24",        # dedup, scoring, graphics, cartography
  "markdown>=3.5",      # tools/render_brief.py
]

[project.optional-dependencies]
# Daily-graphics + cartography suites. Heavy; only needed to render the
# infographic/map PNGs, not to produce the text brief.
graphics = [
  "matplotlib>=3.7",
  "fiona>=1.9",
]
# DuckDB warehouse + multilingual embedding index for the MCP semantic search.
analytics = [
  "duckdb>=0.9",
  "sentence-transformers>=2.2",
]
# Extra upstream source adapters that need a vendor SDK.
sources = [
  "mediacloud>=4.0",
]
# What the daily pipeline actually needs in CI to run every stage.
#
# Deliberately excludes sentence-transformers: it pulls torch (~2 GB, several
# minutes per run) for one optional stage. Everything here is small and fast,
# and each entry corresponds to a stage that silently no-op'd for three months
# because `pip install -e .` installed none of them.
ci = [
  "matplotlib>=3.7",    # graphics stage
  "fiona>=1.9",         # maps + ukraine-maps stages
  "duckdb>=0.9",        # lib/warehouse.py anomaly screen
  "mediacloud>=4.0",    # mediacloud section
]
# Everything, for a full local environment.
all = [
  "matplotlib>=3.7",
  "fiona>=1.9",
  "duckdb>=0.9",
  "sentence-transformers>=2.2",
  "mediacloud>=4.0",
]
# Test + lint tooling.
dev = [
  "pytest>=8.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["worldscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
